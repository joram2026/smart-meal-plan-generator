<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activate Account — Smart Lishe</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <!-- Brand -->
    <div class="auth-brand">
      <div class="brand-icon"><i class="fa-solid fa-seedling"></i></div>
      <h1>Set Your Password</h1>
      <p>Complete your registration by setting a password.</p>
    </div>

    <!-- Form (always visible) -->
    <form id="inviteForm" class="auth-form" novalidate>
      <div class="field-group">
        <label for="invitePassword">Password</label>
        <div class="pw-wrap">
          <input type="password" id="invitePassword" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8">
          <button type="button" class="pw-toggle" id="toggleInvitePw" aria-label="Toggle password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <div class="pw-strength"><div class="pw-strength-fill" id="invitePwStrengthFill"></div></div>
        <div class="pw-strength-label" id="invitePwStrengthLabel"></div>
      </div>

      <div class="field-group">
        <label for="confirmInvitePassword">Confirm Password</label>
        <div class="pw-wrap">
          <input type="password" id="confirmInvitePassword" placeholder="Confirm your password" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" id="toggleConfirmInvitePw" aria-label="Toggle password visibility">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="inviteBtn">
        <i class="fa-regular fa-check"></i> Activate Account
      </button>
    </form>

    <!-- Success & Auto-login (hidden initially) -->
    <div class="auth-success" id="inviteSuccess" style="display:none;">
      <div class="success-icon"><i class="fa-regular fa-circle-check"></i></div>
      <h3>Account Activated!</h3>
      <p id="inviteStatusMessage">Redirecting to your dashboard...</p>
      <div class="spinner" style="margin:16px auto;width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:var(--sukuma);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    </div>

    <div class="auth-links" id="inviteLinks">
      <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
</div>

<style>
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>

<script>
/* ============================================================
   SMART LISHE — CLIENT INVITATION (Set Password + Auto-Login)
   ============================================================ */

const BASE_URL = '/api';
const CLIENT_DASHBOARD = '../client/dashboard.html';

// ---- Get token from URL ----
function getTokenFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('token');
}

const inviteToken = getTokenFromUrl();
console.log('Invitation token:', inviteToken);

// ---- If no token, show warning but keep form visible ----
if (!inviteToken) {
  showToast('⚠️ No invitation token found. The link may be invalid.', 'error');
  // Do NOT hide the form – keep it visible for testing
}

// ---- Toggle Passwords ----
document.getElementById('toggleInvitePw').addEventListener('click', function() {
  const input = document.getElementById('invitePassword');
  const icon = this.querySelector('i');
  input.type = input.type === 'password' ? 'text' : 'password';
  icon.className = input.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
});
document.getElementById('toggleConfirmInvitePw').addEventListener('click', function() {
  const input = document.getElementById('confirmInvitePassword');
  const icon = this.querySelector('i');
  input.type = input.type === 'password' ? 'text' : 'password';
  icon.className = input.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
});

// ---- Password Strength ----
document.getElementById('invitePassword').addEventListener('input', function() {
  const pw = this.value;
  const fill = document.getElementById('invitePwStrengthFill');
  const label = document.getElementById('invitePwStrengthLabel');
  let score = 0;
  if(pw.length >= 8) score++;
  if(/[A-Z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;

  const levels = [
    { w:'0%', c:'transparent', t:'' },
    { w:'25%', c:'var(--char)', t:'Weak' },
    { w:'50%', c:'var(--maize-deep)', t:'Fair' },
    { w:'75%', c:'var(--sukuma-light)', t:'Good' },
    { w:'100%', c:'var(--sukuma)', t:'Strong' }
  ];
  const lv = levels[score] || levels[0];
  fill.style.width = lv.w;
  fill.style.background = lv.c;
  label.textContent = lv.t;
});

// ---- Toast ----
function showToast(msg, type = 'success') {
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
  t.innerHTML = `<i class="fa-solid ${icon}"></i><span>${msg}</span>`;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(40px)'; setTimeout(() => t.remove(), 350); }, 3500);
}

// ---- Auto-login function ----
async function autoLogin(email, password) {
  try {
    const res = await fetch(`${BASE_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    // Store tokens
    localStorage.setItem('access_token', data.data.access_token);
    localStorage.setItem('smartlishe_token', data.data.access_token);
    localStorage.setItem('smartlishe_role', 'client');
    // Redirect to client dashboard
    window.location.href = CLIENT_DASHBOARD;
  } catch (err) {
    // Fallback: show manual login button
    document.getElementById('inviteStatusMessage').textContent = 'Account activated, but we could not log you in automatically. Please log in manually.';
    document.getElementById('inviteSuccess').innerHTML = `
      <div class="success-icon"><i class="fa-regular fa-circle-check"></i></div>
      <h3>Account Activated!</h3>
      <p>Your password has been set. Please log in.</p>
      <button class="btn btn-primary" id="goToLoginFromInvite">
        <i class="fa-regular fa-right-to-bracket"></i> Go to Login
      </button>
    `;
    document.getElementById('goToLoginFromInvite').addEventListener('click', function() {
      window.location.href = 'login.html';
    });
  }
}

// ---- Form Submit ----
document.getElementById('inviteForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const password = document.getElementById('invitePassword').value;
  const confirm = document.getElementById('confirmInvitePassword').value;

  if(password.length < 8) { showToast('Password must be at least 8 characters.', 'error'); return; }
  if(password !== confirm) { showToast('Passwords do not match.', 'error'); return; }
  if(!inviteToken) { showToast('No invitation token. Please use the link from your email.', 'error'); return; }

  const btn = document.getElementById('inviteBtn');
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Activating...';

  try {
    const response = await fetch(`${BASE_URL}/client/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: inviteToken,
        password: password
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || data.message || 'Activation failed');
    }

    // Success – hide form, show success message with auto-login
    document.getElementById('inviteForm').style.display = 'none';
    document.getElementById('inviteLinks').style.display = 'none';
    document.getElementById('inviteSuccess').style.display = 'block';

    // If we have the email from the response, auto-login
    if (data.data && data.data.email) {
      document.getElementById('inviteStatusMessage').textContent = 'Account activated! Redirecting to your dashboard...';
      await autoLogin(data.data.email, password);
    } else {
      // Fallback: show login button
      document.getElementById('inviteStatusMessage').textContent = 'Account activated! Please log in.';
      document.getElementById('inviteSuccess').innerHTML = `
        <div class="success-icon"><i class="fa-regular fa-circle-check"></i></div>
        <h3>Account Activated!</h3>
        <p>Your password has been set. Please log in.</p>
        <button class="btn btn-primary" id="goToLoginFromInvite">
          <i class="fa-regular fa-right-to-bracket"></i> Go to Login
        </button>
      `;
      document.getElementById('goToLoginFromInvite').addEventListener('click', function() {
        window.location.href = 'login.html';
      });
    }

  } catch (err) {
    showToast(err.message || 'An error occurred. Please try again.', 'error');
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
});

// ---- Auto-focus ----
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('invitePassword').focus();
});
</script>
</body>
</html>
