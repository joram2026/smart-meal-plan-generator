<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activate Account — Smart Lishe</title>
  <link rel="stylesheet" href="../auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-card" style="max-width: 480px;">
    <div class="auth-brand">
      <div class="brand-icon"><i class="fa-solid fa-seedling"></i></div>
      <h1 id="invitationHeader">Activate Your Client Portal</h1>
      <p id="invitationSubtitle">Welcome to Smart Lishe! Set your password to activate your personalized nutrition dashboard.</p>
    </div>

    <!-- Invitation Info Card (Loaded via token) -->
    <div id="invitationSummary" style="display: none; background: rgba(22, 101, 52, 0.05); border: 1px solid rgba(22, 101, 52, 0.15); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem;">
      <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem;">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: #166534; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem;" id="proAvatar">
          DR
        </div>
        <div>
          <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #166534; font-weight: 600;">Invited By Professional</div>
          <div style="font-weight: 700; color: #1f2937;" id="proNameDisplay">Nutritionist</div>
        </div>
      </div>
      <div style="font-size: 0.85rem; color: #4b5563; border-top: 1px solid rgba(22, 101, 52, 0.1); padding-top: 0.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
        <div><strong>Program:</strong> <span id="programDisplay">Personalized Plan</span></div>
        <div><strong>Goal:</strong> <span id="goalDisplay">General Wellness</span></div>
      </div>
    </div>

    <form id="setPasswordForm" class="auth-form" novalidate>
      <input type="hidden" id="inviteToken">
      <div class="field-group">
        <label for="clientEmailDisplay">Account Email</label>
        <input type="email" id="clientEmailDisplay" readonly style="background: #f9fafb; cursor: not-allowed; opacity: 0.85;">
      </div>
      <div class="field-group">
        <label for="clientPassword">Create Password</label>
        <input type="password" id="clientPassword" placeholder="At least 8 characters" required minlength="8">
      </div>
      <div class="field-group">
        <label for="clientConfirmPassword">Confirm Password</label>
        <input type="password" id="clientConfirmPassword" placeholder="Confirm your password" required>
      </div>

      <button type="submit" class="btn btn-primary" id="setPassBtn" style="margin-top: 0.5rem;">
        <i class="fa-solid fa-check"></i> Activate Account & Open Portal
      </button>
    </form>

    <div class="auth-links" style="margin-top: 1.5rem;">
      <p>Already have your password set? <a href="../login.html">Login here</a></p>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SMART LISHE — CLIENT SET PASSWORD & ACTIVATION
   ============================================================ */

const BASE_URL = '/api';

// Get token from URL
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

async function loadInvitationDetails() {
  if (!token) {
    document.getElementById('invitationSubtitle').innerHTML = '<span style="color: #dc2626; font-weight: 600;">No invitation token provided. Please check the link in your email.</span>';
    document.getElementById('setPasswordForm').style.display = 'none';
    return;
  }

  document.getElementById('inviteToken').value = token;

  try {
    const res = await fetch(`${BASE_URL}/client/invitation-info?token=${encodeURIComponent(token)}`);
    const result = await res.json();

    if (!res.ok) {
      throw new Error(result.error || result.message || 'Invitation is invalid or has expired.');
    }

    const data = result.data;
    if (data.email) {
      document.getElementById('clientEmailDisplay').value = data.email;
    }
    if (data.professional?.name) {
      document.getElementById('proNameDisplay').textContent = data.professional.name;
      const initials = data.professional.name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'DR';
      document.getElementById('proAvatar').textContent = initials;
    }
    if (data.program) {
      document.getElementById('programDisplay').textContent = data.program;
    }
    if (data.goal) {
      document.getElementById('goalDisplay').textContent = data.goal;
    }

    document.getElementById('invitationSummary').style.display = 'block';
  } catch (err) {
    document.getElementById('invitationSubtitle').innerHTML = `<span style="color: #dc2626; font-weight: 600;">${err.message}</span>`;
    document.getElementById('setPasswordForm').style.display = 'none';
  }
}

loadInvitationDetails();

function showToast(msg, type = 'success') {
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
  t.innerHTML = `<i class="fa-solid ${icon}"></i><span>${msg}</span>`;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(40px)'; setTimeout(() => t.remove(), 350); }, 3500);
}

document.getElementById('setPasswordForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const token = document.getElementById('inviteToken').value;
  const password = document.getElementById('clientPassword').value;
  const confirm = document.getElementById('clientConfirmPassword').value;

  if (!token) {
    showToast('Invitation token is missing.', 'error');
    return;
  }
  if (password.length < 8) {
    showToast('Password must be at least 8 characters.', 'error');
    return;
  }
  if (password !== confirm) {
    showToast('Passwords do not match.', 'error');
    return;
  }

  const btn = document.getElementById('setPassBtn');
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Activating Portal...';

  try {
    const response = await fetch(`${BASE_URL}/client/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || data.message || 'Activation failed');
    }

    if (data.data?.access_token) {
      localStorage.setItem('auth_token', data.data.access_token);
      localStorage.setItem('token', data.data.access_token);
      if (data.data.user) {
        localStorage.setItem('user', JSON.stringify(data.data.user));
      }
    }

    showToast('Portal activated successfully! Welcome to Smart Lishe.');
    setTimeout(() => {
      window.location.href = '../client/dashboard.html';
    }, 1500);

  } catch (err) {
    showToast(err.message || 'An error occurred. Please try again.', 'error');
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
});
</script>
</body>
</html>
