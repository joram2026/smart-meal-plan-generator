<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Lishe</title>
  <!-- Redirect immediately to user/home.html -->
  <meta http-equiv="refresh" content="0; url=user/home.html">
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
    }
    .loader {
      text-align: center;
    }
    .loader .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e2e8f0;
      border-top-color: #1a7a64;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    .loader p {
      color: #64748b;
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Redirecting to Smart Lishe...</p>
  </div>

  <!-- Fallback JavaScript redirect if meta refresh fails -->
  <script>
    window.location.replace('user/home.html');
  </script>
</body>
</html>
