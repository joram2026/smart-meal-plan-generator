<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for text paths -->
  <defs>
    <path id="topTextPath" d="M 60,250 A 190,190 0 1,1 440,250" />
    <path id="bottomTextPath" d="M 65,250 A 185,185 0 0,0 435,250" />
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Green Ring -->
  <circle cx="250" cy="230" r="220" fill="#7CBD32" stroke="#4C8019" stroke-width="3" />

  <!-- Outer Ring Text (JKUAT) -->
  <text font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="24" fill="#0A0A0A" letter-spacing="2">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">JOMO KENYATTA UNIVERSITY</textPath>
  </text>
  <text font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="20" fill="#0A0A0A" letter-spacing="1">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">OF AGRICULTURE AND TECHNOLOGY</textPath>
  </text>

  <!-- Red Cog / Gear Wheel -->
  <g transform="translate(250,230)">
    <!-- Gear teeth (16 teeth) -->
    <path d="
      M 0,-175 L 18,-175 L 15,-155 L -15,-155 L -18,-175 Z
      M 0,-175
    " fill="#E31E24" transform="rotate(0)" />
    <g fill="#E31E24">
      <circle cx="0" cy="0" r="162" />
      <!-- Teeth iteration using rotate -->
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(0)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(22.5)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(45)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(67.5)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(90)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(112.5)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(135)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(157.5)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(180)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(202.5)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(225)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(247.5)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(270)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(292.5)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(315)" />
      <rect x="-14" y="-178" width="28" height="30" rx="3" transform="rotate(337.5)" />
    </g>
    
    <!-- Yellow Inner Border Ring -->
    <circle cx="0" cy="0" r="138" fill="#7CBD32" />
    <!-- Sky Blue Field -->
    <circle cx="0" cy="0" r="130" fill="#58B2DC" />

    <!-- Mount Kenya (Brown / Snow Peaks) -->
    <polygon points="-120,60 -60,-40 -20,10 0,-50 30,0 80,-30 120,60" fill="#7A5230" />
    <polygon points="-60,-40 -45,-15 -70,0" fill="#FFFFFF" />
    <polygon points="0,-50 15,-20 -10,-10" fill="#FFFFFF" />
    <polygon points="80,-30 90,-10 70,0" fill="#FFFFFF" />

    <!-- Open Book in Foreground -->
    <g transform="translate(0, 30)">
      <!-- Book Pages -->
      <path d="M -75,-25 C -40,-35 -10,-20 0,-10 C 10,-20 40,-35 75,-25 L 75,35 C 40,25 10,38 0,45 C -10,38 -40,25 -75,35 Z" fill="#FFFFFF" stroke="#333333" stroke-width="3" />
      <line x1="0" y1="-10" x2="0" y2="45" stroke="#333333" stroke-width="3" />
      
      <!-- Maize / Corn Left Page -->
      <g transform="translate(-38, 5) scale(0.65)">
        <path d="M 0,-30 C 15,-10 15,20 0,35 C -15,20 -15,-10 0,-30 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="2" />
        <path d="M -15,-10 C -25,-25 -5,-35 0,-30" fill="none" stroke="#1B5E20" stroke-width="2" />
        <path d="M 15,-10 C 25,-25 5,-35 0,-30" fill="none" stroke="#1B5E20" stroke-width="2" />
        <!-- Corn cob in center -->
        <ellipse cx="0" cy="0" rx="7" ry="18" fill="#FBC02D" stroke="#F57F17" stroke-width="1.5" />
      </g>

      <!-- Maize / Corn Right Page -->
      <g transform="translate(38, 5) scale(0.65)">
        <path d="M 0,-30 C 15,-10 15,20 0,35 C -15,20 -15,-10 0,-30 Z" fill="#2E7D32" stroke="#1B5E20" stroke-width="2" />
        <path d="M -15,-10 C -25,-25 -5,-35 0,-30" fill="none" stroke="#1B5E20" stroke-width="2" />
        <path d="M 15,-10 C 25,-25 5,-35 0,-30" fill="none" stroke="#1B5E20" stroke-width="2" />
        <!-- Corn cob in center -->
        <ellipse cx="0" cy="0" rx="7" ry="18" fill="#FBC02D" stroke="#F57F17" stroke-width="1.5" />
      </g>
    </g>
  </g>

  <!-- Red Banner Ribbon at Bottom -->
  <g transform="translate(250, 435)">
    <!-- Banner tails -->
    <path d="M -210,0 L -170,-25 L -170,15 Z" fill="#B31217" />
    <path d="M 210,0 L 170,-25 L 170,15 Z" fill="#B31217" />
    
    <!-- Main Ribbon Body -->
    <path d="M -195,-20 C -100,5 100,5 195,-20 L 180,25 C 90,45 -90,45 -180,25 Z" fill="#E31E24" stroke="#B31217" stroke-width="2" />
    
    <!-- Banner Text -->
    <text x="0" y="10" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      TECHNOLOGY FOR DEVELOPMENT
    </text>
  </g>
</svg>
