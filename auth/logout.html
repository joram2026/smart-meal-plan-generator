<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  
  <!-- ✅ META REFRESH FALLBACK – redirects after 2.5s even if JavaScript fails -->
  <meta http-equiv="refresh" content="2.5; url=../user/home.html">
  
  <title>Logout — Smart Lishe</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .auth-card {
      text-align: center;
      padding: 50px 44px;
    }
    .spinner-wrapper {
      margin: 30px 0 20px;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 4px solid var(--basket-line, #e2e8f0);
      border-top-color: var(--sukuma, #1a7a64);
      animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      color: var(--text-secondary, #64748b);
      font-size: 0.92rem;
      margin-top: 16px;
      font-weight: 500;
    }
    .checkmark {
      display: none;
      width: 60px;
      height: 60px;
      margin: 0 auto;
      background: var(--sukuma, #1a7a64);
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #fff;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .checkmark.show {
      display: flex;
    }
    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .checkmark.show ~ .spinner {
      display: none;
    }
    .checkmark.show ~ .status-text {
      color: var(--sukuma, #1a7a64);
      font-weight: 600;
    }
    .auth-links {
      margin-top: 28px;
      font-size: 0.92rem;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .auth-links a {
      color: var(--sukuma, #1a7a64);
      font-weight: 700;
      transition: color 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .auth-links a:hover {
      color: var(--sukuma-dark, #0d4f40);
      text-decoration: underline;
    }
    .auth-links .divider {
      color: var(--text-muted, #94a3b8);
    }
    @media (max-width: 480px) {
      .auth-card { padding: 32px 20px 28px; }
      .auth-brand h1 { font-size: 1.5rem; }
      .auth-brand .brand-icon { width: 56px; height: 56px; font-size: 1.6rem; }
      .spinner, .checkmark { width: 50px; height: 50px; font-size: 1.8rem; }
      .status-text { font-size: 0.85rem; }
      .auth-links { font-size: 0.85rem; flex-direction: column; gap: 8px; align-items: center; }
      .auth-links .divider { display: none; }
    }
    @media (max-width: 360px) {
      .auth-card { padding: 24px 16px 20px; }
      .auth-brand h1 { font-size: 1.3rem; }
      .auth-brand .brand-icon { width: 48px; height: 48px; font-size: 1.4rem; }
    }
    body.dark-mode .spinner {
      border-color: #374151;
      border-top-color: var(--sukuma, #1a7a64);
    }
    body.dark-mode .checkmark {
      background: var(--sukuma, #1a7a64);
    }
    body.dark-mode .checkmark ~ .status-text {
      color: var(--sukuma, #1a7a64);
    }
    body.dark-mode .auth-links a {
      color: #6ee7b7;
    }
    body.dark-mode .auth-links a:hover {
      color: #a7f3d0;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">

    <div class="auth-brand">
      <div class="brand-icon"><i class="fa-solid fa-seedling"></i></div>
      <h1>Logging Out</h1>
      <p>See you soon! 👋</p>
    </div>

    <div class="spinner-wrapper">
      <div class="spinner" id="logoutSpinner"></div>
      <div class="checkmark" id="logoutCheckmark">
        <i class="fa-solid fa-check"></i>
      </div>
      <p class="status-text" id="statusText">Clearing your session...</p>
    </div>

    <div class="auth-links">
      <a href="../user/home.html" id="homeLink">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
      <span class="divider">·</span>
      <a href="../auth/login.html" id="loginLink">
        <i class="fa-solid fa-right-to-bracket"></i> Login Again
      </a>
    </div>

  </div>
</div>

<script>
/* ============================================================
   SMART LISHE — LOGOUT
   Redirects ALL users to ../user/home.html
   ============================================================ */

(function() {
  'use strict';

  // ---- Clear all session data ----
  const keysToRemove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && (
      key.startsWith('smartlishe_') ||
      key.startsWith('sl_') ||
      key === 'access_token' ||
      key === 'email' ||
      key === 'firstName' ||
      key === 'lastName' ||
      key === 'phone' ||
      key === 'role' ||
      key === 'smartlishe_logged_in' ||
      key === 'smartlishe_role' ||
      key === 'smartlishe_password' ||
      key === 'smartlishe_profile'
    )) {
      keysToRemove.push(key);
    }
  }
  keysToRemove.forEach(k => localStorage.removeItem(k));
  sessionStorage.clear();

  // ---- Show success state ----
  const spinner = document.getElementById('logoutSpinner');
  const checkmark = document.getElementById('logoutCheckmark');
  const statusText = document.getElementById('statusText');

  setTimeout(function() {
    spinner.style.display = 'none';
    checkmark.classList.add('show');
    statusText.textContent = 'Logged out successfully! Redirecting...';
  }, 300);

  // ---- Redirect to ../user/home.html ----
  // The meta refresh tag is the primary redirect mechanism.
  // This JavaScript redirect is a backup.
  setTimeout(function() {
    window.location.href = '../user/home.html';
  }, 2000);

  console.log('🔐 Logged out. Redirecting to user/home.html');
  console.log('   Cleared keys:', keysToRemove);

})();
</script>

</body>
</html>
