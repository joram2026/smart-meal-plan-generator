[build]
  functions = "netlify/functions"
  publish = "FRONTEND"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/user/home.html"
  status = 302

[[redirects]]
  from = "/*"
  to = "/user/home.html"
  status = 200
