<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Details — Smart Lishe Professional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="professional.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ===== BASE OVERRIDES ===== */
    .client-profile-header {
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 30px 36px;
      background: var(--bg-elevated);
      border: 1px solid var(--basket-line);
      border-radius: var(--radius-lg);
      margin-bottom: 24px;
      flex-wrap: wrap;
      position: relative;
    }
    .client-profile-header .cp-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sukuma), var(--maize));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2.4rem;
      font-weight: 700;
      font-family: var(--font-display);
      flex-shrink: 0;
      position: relative;
    }
    .client-profile-header .cp-avatar .online-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid var(--bg-elevated);
    }
    .client-profile-header .cp-avatar .online-dot.online { background: #2ECC71; }
    .client-profile-header .cp-avatar .online-dot.offline { background: #95A5A6; }
    .client-profile-header .cp-info { flex: 1; min-width: 200px; }
    .client-profile-header .cp-info h2 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      margin-bottom: 4px;
    }
    .client-profile-header .cp-info .cp-id {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .client-profile-header .cp-info .cp-details {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 10px;
    }
    .client-profile-header .cp-info .cp-details span {
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .client-profile-header .cp-info .cp-details i { color: var(--accent-3); width: 16px; }
    .client-profile-header .cp-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .client-profile-header .cp-actions .btn-sm { font-size: 0.78rem; padding: 8px 16px; }

    .summary-stats-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }
    @media(max-width: 1100px) { .summary-stats-grid { grid-template-columns: repeat(3, 1fr); } }
    @media(max-width: 550px) { .summary-stats-grid { grid-template-columns: repeat(2, 1fr); } }

    .summary-stat-item {
      background: var(--bg-elevated);
      border: 1px solid var(--basket-line);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .summary-stat-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-soft);
    }
    .summary-stat-item .num {
      font-family: var(--font-mono);
      font-size: 1.3rem;
      font-weight: 700;
      display: block;
    }
    .summary-stat-item .label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .client-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      border-bottom: 2px solid var(--basket-line);
      margin-bottom: 24px;
      padding-bottom: 0;
    }
    .client-tab {
      padding: 12px 20px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.25s ease;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .client-tab:hover { color: var(--text-primary); }
    .client-tab.active {
      color: var(--sukuma);
      border-bottom-color: var(--sukuma);
    }
    .client-tab i { margin-right: 8px; }

    .tab-content { display: none; animation: fadeIn 0.35s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .health-detail-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .health-detail-tag.diabetes { background: rgba(193,68,14,0.12); color: var(--char); }
    .health-detail-tag.hypertension { background: rgba(232,163,61,0.15); color: var(--maize-deep); }
    .health-detail-tag.obesity { background: rgba(193,68,14,0.08); color: var(--char-light); }
    .health-detail-tag.pregnancy { background: rgba(45,80,22,0.1); color: var(--sukuma); }

    .risk-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .risk-indicator.stable { background: rgba(45,80,22,0.12); color: var(--sukuma); }
    .risk-indicator.moderate { background: rgba(232,163,61,0.15); color: var(--maize-deep); }
    .risk-indicator.high { background: rgba(193,68,14,0.12); color: var(--char); }

    .goal-card {
      background: var(--bg-elevated);
      border: 1px solid var(--basket-line);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 10px;
    }
    .goal-card .goal-info { flex: 1; min-width: 150px; }
    .goal-card .goal-info h4 { font-size: 0.92rem; }
    .goal-card .goal-info .goal-sub { font-size: 0.78rem; color: var(--text-muted); }
    .goal-card .goal-progress { text-align: center; min-width: 80px; }
    .goal-card .goal-progress .progress-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.85rem;
      position: relative;
      margin: 0 auto;
    }
    .goal-card .goal-progress .progress-circle::before {
      content: '';
      position: absolute;
      inset: 3px;
      border-radius: 50%;
      background: var(--bg-elevated);
    }
    .goal-card .goal-progress .progress-circle .val { position: relative; z-index: 1; }

    .meal-plan-card {
      background: var(--bg-elevated);
      border: 1px solid var(--basket-line);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 16px;
    }
    .meal-plan-card .mp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .meal-plan-card .mp-header h4 { font-family: var(--font-display); font-size: 1.05rem; }
    .meal-plan-card .mp-macros {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .meal-plan-card .mp-macros .macro {
      text-align: center;
      padding: 8px 14px;
      background: var(--bg-card);
      border-radius: var(--radius-sm);
    }
    .meal-plan-card .mp-macros .macro .num {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.95rem;
      display: block;
    }
    .meal-plan-card .mp-macros .macro .label {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .compliance-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--basket-line);
    }
    .compliance-item:last-child { border-bottom: none; }
    .compliance-item .ci-label {
      font-weight: 600;
      font-size: 0.85rem;
      min-width: 130px;
    }
    .compliance-item .ci-bar {
      flex: 1;
      height: 8px;
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
    }
    .compliance-item .ci-bar .fill {
      height: 100%;
      border-radius: 10px;
      transition: width 1s ease;
    }
    .compliance-item .ci-value {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.82rem;
      min-width: 45px;
      text-align: right;
    }

    .alert-card {
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      border-left: 4px solid var(--maize-deep);
      background: rgba(232,163,61,0.06);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .alert-card .alert-icon { font-size: 1.1rem; }
    .alert-card .alert-text { flex: 1; font-size: 0.85rem; color: var(--text-secondary); }
    .alert-card .alert-text strong { color: var(--text-primary); }
    .alert-card.alert-danger { border-left-color: var(--char); background: rgba(193,68,14,0.06); }
    .alert-card.alert-success { border-left-color: var(--sukuma); background: rgba(45,80,22,0.06); }

    .message-preview {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      border: 1px solid var(--basket-line);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .message-preview .msg-sender { font-weight: 700; font-size: 0.85rem; }
    .message-preview .msg-preview { font-size: 0.8rem; color: var(--text-secondary); }
    .message-preview .msg-time { font-size: 0.68rem; color: var(--text-muted); }

    .note-area {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--basket-line);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.88rem;
      resize: vertical;
      min-height: 120px;
      font-family: var(--font-body);
    }
    .note-area:focus {
      outline: none;
      border-color: var(--sukuma);
    }

    .report-card {
      background: var(--bg-elevated);
      border: 1px solid var(--basket-line);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 10px;
      transition: transform 0.2s ease;
    }
    .report-card:hover { transform: translateX(4px); }
    .report-card .report-info .report-title { font-weight: 700; font-size: 0.88rem; }
    .report-card .report-info .report-date { font-size: 0.78rem; color: var(--text-muted); }
    .report-card .report-actions { display: flex; gap: 8px; }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    @media(max-width: 500px) { .chart-grid { grid-template-columns: 1fr; } }

    .chart-card {
      background: var(--bg-elevated);
      border: 1px solid var(--basket-line);
      border-radius: var(--radius-md);
      padding: 20px;
    }
    .chart-card .chart-title {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .chart-card canvas { width: 100%; height: 220px; }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .back-home:hover { color: var(--text-primary); }

    .food-log-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      border: 1px solid var(--basket-line);
    }
    .food-log-item .fl-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: #fff;
      flex-shrink: 0;
    }
    .food-log-item .fl-info { flex: 1; }
    .food-log-item .fl-info strong { display: block; font-size: 0.85rem; }
    .food-log-item .fl-info span { font-size: 0.72rem; color: var(--text-muted); }
    .food-log-item .fl-cal {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.8rem;
    }

    /* ===== BOTTOM-LEFT ACTION PANEL ===== */
    .action-panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 900;
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .action-panel-overlay.show { display: block; opacity: 1; }

    .action-panel {
      position: fixed;
      bottom: 30px;
      left: 30px;
      z-index: 1000;
      width: 480px;
      max-width: calc(100vw - 60px);
      max-height: 80vh;
      background: var(--bg-elevated);
      border: 1px solid var(--basket-line);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      padding: 0;
      display: none;
      flex-direction: column;
      transform: translateY(30px) scale(0.96);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
      overflow: hidden;
    }
    .action-panel.open { display: flex; transform: translateY(0) scale(1); opacity: 1; }

    .action-panel .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--basket-line);
      background: var(--bg-card);
    }
    .action-panel .panel-header h3 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
    }
    .action-panel .panel-header .close-panel {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.2s;
    }
    .action-panel .panel-header .close-panel:hover { color: var(--text-primary); }

    .action-panel .panel-body {
      padding: 24px;
      overflow-y: auto;
      flex: 1;
    }
    .action-panel .panel-body .field-group { margin-bottom: 16px; }
    .action-panel .panel-body .field-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .action-panel .panel-body .field-group input,
    .action-panel .panel-body .field-group select,
    .action-panel .panel-body .field-group textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--basket-line);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 0.88rem;
      font-family: var(--font-body);
      transition: border 0.2s;
    }
    .action-panel .panel-body .field-group input:focus,
    .action-panel .panel-body .field-group select:focus,
    .action-panel .panel-body .field-group textarea:focus {
      outline: none;
      border-color: var(--sukuma);
    }
    .action-panel .panel-body .field-group textarea { resize: vertical; min-height: 80px; }
    .action-panel .panel-body .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .action-panel .panel-body .btn-row .btn { flex: 1; min-width: 100px; }

    @media (max-width: 600px) {
      .action-panel { bottom: 16px; left: 16px; max-width: calc(100vw - 32px); max-height: 70vh; border-radius: var(--radius-md); }
      .action-panel .panel-header { padding: 14px 18px; }
      .action-panel .panel-body { padding: 16px; }
      .action-panel .panel-body .btn-row .btn { flex: 1 1 100%; }
    }

    .floating-ai-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 998;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sukuma), var(--sukuma-light));
      color: #fff;
      border: none;
      box-shadow: 0 8px 32px rgba(45,80,22,0.35);
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .floating-ai-btn:hover { transform: scale(1.08); box-shadow: 0 12px 40px rgba(45,80,22,0.45); }
    .floating-ai-btn .ping-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #10b981;
      border: 2px solid #fff;
      animation: ping 2s infinite;
    }
    @keyframes ping { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
    @media (max-width: 600px) { .floating-ai-btn { width: 50px; height: 50px; font-size: 1.2rem; bottom: 20px; right: 20px; } }

    .toast-stack {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
      width: calc(100% - 48px);
    }
    .toast {
      background: var(--bg-elevated);
      border: 1px solid var(--basket-line);
      border-left: 4px solid var(--sukuma);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      animation: slideUp 0.3s ease;
      backdrop-filter: blur(8px);
    }
    .toast.error { border-left-color: #dc2626; }
    .toast i { font-size: 1.2rem; color: var(--sukuma); }
    .toast.error i { color: #dc2626; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .client-not-found {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .client-not-found i {
      font-size: 3rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: block;
    }
    .client-not-found h2 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    .client-not-found .btn {
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="mark"><i class="fa-solid fa-seedling"></i></div>
        <div class="name">Smart Lishe<span>Professional</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="home.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
        <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <a href="clients.html" class="nav-link"><i class="fa-solid fa-users"></i> Clients</a>
        <a href="ai-assistant.html" class="nav-link"><i class="fa-solid fa-robot"></i> AI Assistant</a>
        <a href="engagement.html" class="nav-link"><i class="fa-solid fa-rocket"></i> Engagement</a>
        <a href="profile.html" class="nav-link"><i class="fa-solid fa-user"></i> Profile</a>
        <a href="billing.html" class="nav-link"><i class="fa-solid fa-credit-card"></i> Billing</a>
        <a href="settings.html" class="nav-link"><i class="fa-solid fa-gear"></i> Settings</a>
      </nav>
      <div class="sidebar-footer">
        <a href="../auth/logout.html" class="nav-link" style="color:var(--char);"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="topbar">
        <div class="topbar-left">
          <button class="hamburger-btn" id="hamburgerBtn"><i class="fa-solid fa-bars"></i></button>
          <div class="search-box"><i class="fa-solid fa-search"></i><input type="text" placeholder="Search clients..."></div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn"><i class="fa-regular fa-bell"></i><span class="dot"></span></button>
          <div class="profile-chip" id="profileChip">
            <div class="avatar" id="profileAvatar">PK</div>
            <span class="label" id="profileName">Dr. Peter</span>
            <span class="pro-badge" style="font-size:0.55rem;padding:2px 8px;">PRO</span>
          </div>
        </div>
      </div>

      <div class="page-inner" id="pageContent">
        <!-- Content rendered by JavaScript -->
      </div>
    </main>
  </div>

  <!-- ===== ACTION PANEL OVERLAY ===== -->
  <div class="action-panel-overlay" id="actionPanelOverlay"></div>

  <!-- ===== ACTION PANEL (Bottom-Left) ===== -->
  <div class="action-panel" id="actionPanel">
    <div class="panel-header">
      <h3 id="panelTitle">Action</h3>
      <button class="close-panel" id="closePanel"><i class="fa-regular fa-xmark"></i></button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>

  <!-- ===== FLOATING AI BUTTON ===== -->

                     localStorage.getItem('smartlishe_token') || 
                     localStorage.getItem('token');

      console.log('🔐 Token found:', token ? '✅ Yes' : '❌ No');
      console.log('🔐 Role:', role);

      if (!token) {
        console.warn('⚠️ No token – redirecting to login');
        window.location.href = '../auth/login.html';
        return;
      }
      if (!role || role.toLowerCase() !== 'professional') {
        console.warn('⚠️ Role not Professional – redirecting to dashboard');
        window.location.href = 'dashboard.html';
        return;
      }
      console.log('✅ Authentication passed.');

    // -------- HELPERS --------
    function getToken() {
      return localStorage.getItem('access_token') || 
             localStorage.getItem('smartlishe_token') || 
             localStorage.getItem('token') || '';
    }

    function getHeaders() {
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${getToken()}`
      };
    }

    async function apiRequest(endpoint, method = 'GET', body = null) {
      const url = `${API_BASE}${endpoint}`;
      const options = { method, headers: getHeaders() };
      if (body) options.body = JSON.stringify(body);
      const res = await fetch(url, options);
      if (!res.ok) {
        const err = await res.text();
        throw new Error(err);
      }
      return res.json();
    }

    function showToast(message, type = 'success') {
      const stack = document.getElementById('toastStack');
      if (!stack) return;
      const toast = document.createElement('div');
      toast.className = 'toast' + (type === 'error' ? ' error' : '');
      const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-check-circle';
      toast.innerHTML = `<i class="fa-regular ${icon}"></i><span>${message}</span>`;
      stack.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(40px)';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }
    window.showToast = showToast;

      const firstName = localStorage.getItem('firstName') || 'Professional';
      const lastName = localStorage.getItem('lastName') || '';
      return firstName + (lastName ? ' ' + lastName : '');

      const name = getProfessionalName();
      const parts = name.split(' ');
      if (parts.length >= 2) return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();

    // -------- TAB LISTENERS --------
    function attachTabListeners() {
      const tabs = document.querySelectorAll('.client-tab');
      const contents = document.querySelectorAll('.tab-content');
      tabs.forEach(tab => {
        tab.addEventListener('click', function() {
          tabs.forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          contents.forEach(c => c.classList.remove('active'));
          const target = document.getElementById('tab-' + this.dataset.tab);
          if (target) target.classList.add('active');
        });
      });
    }

    // -------- ACTION BUTTONS --------
    function attachActionButtons(client) {
      // Override the edit action to open a comprehensive edit panel
      document.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', function() {
          const action = this.dataset.action;
          if (action === 'edit') {
            openPanel('Edit Client', getEditContent(client));
          } else if (action === 'message') {
            openPanel('Send Message to Client', getMessageContent(client, true));
          } else {
            const info = actionMap[action];
            if (info) openPanel(info.title, info.content(client));
          }
        });
      });

      document.getElementById('assignNewPlanBtn')?.addEventListener('click', () => { openPanel('Assign Meal Plan', getAssignContent(client)); });
      document.getElementById('scheduleAppointmentBtn')?.addEventListener('click', () => { openPanel('Schedule Appointment', getScheduleContent(client)); });
      document.getElementById('generateReportBtn')?.addEventListener('click', () => { openPanel('Generate Report', getReportContent(client)); });
      document.getElementById('newMessageBtn')?.addEventListener('click', () => { openPanel('Send Message', getMessageContent(client, false)); });
      document.getElementById('shareReportBtn')?.addEventListener('click', () => { showToast('Sharing report...'); });

        } catch(e) {
          showToast('Failed to save notes: ' + e.message, 'error');
        }
      });
      document.getElementById('editNotesBtn')?.addEventListener('click', () => {
        document.getElementById('clientNotes').focus();
        showToast('Edit notes mode enabled.');
      });

    function openPanel(title, htmlContent) {
      panelTitle.textContent = title;
      panelBody.innerHTML = htmlContent;
      panel.classList.add('open');
      overlay.classList.add('show');
      // Auto-submit handling
      panelBody.querySelectorAll('form').forEach(form => {
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          showToast('Action completed successfully!');
          closePanel();
        });

        btn.addEventListener('click', function() {

      });

    // -------- ENHANCED EDIT CONTENT (with all fields) --------
    function getEditContent(client) {
      const selectedConditions = client.medical_conditions || [];
      const selectedAllergies = client.allergies || [];
      const selectedGoal = client.goal || 'Weight Loss';
      const selectedProgram = client.program || 'General Wellness Plan';
      const selectedDuration = client.duration || '12 Weeks';

      function buildCheckboxes(options, selected, name) {
        return options.map(opt => `
          <label style="display:inline-flex;align-items:center;gap:6px;margin-right:12px;font-weight:400;font-size:0.85rem;">
            <input type="checkbox" name="${name}" value="${opt}" ${selected.includes(opt) ? 'checked' : ''}>
            ${opt}
          </label>
        `).join('');
      }

      return `
        <form id="editClientForm">
          <div class="field-group"><label>First Name</label><input type="text" id="editFirstName" value="${client.name ? client.name.split(' ')[0] : ''}"></div>
          <div class="field-group"><label>Last Name</label><input type="text" id="editLastName" value="${client.name ? client.name.split(' ').slice(1).join(' ') : ''}"></div>
          <div class="field-group"><label>Email</label><input type="email" id="editEmail" value="${client.email || ''}"></div>
          <div class="field-group"><label>Phone</label><input type="tel" id="editPhone" value="${client.phone || ''}"></div>
          <div class="field-group"><label>Gender</label>
            <select id="editGender">
              <option ${client.gender === 'Female' ? 'selected' : ''}>Female</option>
              <option ${client.gender === 'Male' ? 'selected' : ''}>Male</option>
              <option ${client.gender === 'Other' ? 'selected' : ''}>Other</option>
            </select>
          </div>
          <div class="field-group"><label>Date of Birth</label><input type="date" id="editDob" value="${client.dob || ''}"></div>
          <div class="field-row">
            <div class="field-group"><label>Height (cm)</label><input type="number" id="editHeight" step="0.1" value="${client.height_cm || ''}" oninput="calculateBMI()"></div>
            <div class="field-group"><label>Weight (kg)</label><input type="number" id="editWeight" step="0.1" value="${client.weight_kg || ''}" oninput="calculateBMI()"></div>
          </div>
          <div class="field-group"><label>BMI <span id="bmiDisplay" style="font-weight:700;color:var(--sukuma);">${client.bmi || '—'}</span></label></div>

          <div class="field-group"><label>Medical Conditions (select all that apply)</label>
            <div style="display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;">
              ${buildCheckboxes(CONDITION_OPTIONS, selectedConditions, 'conditions')}
            </div>
          </div>

          <div class="field-group"><label>Allergies (select all that apply)</label>
            <div style="display:flex;flex-wrap:wrap;gap:6px;padding:8px 0;">
              ${buildCheckboxes(ALLERGY_OPTIONS, selectedAllergies, 'allergies')}
            </div>
          </div>

          <div class="field-group"><label>Primary Goal</label>
            <select id="editGoal">
              ${GOAL_OPTIONS.map(g => `<option value="${g}" ${g === selectedGoal ? 'selected' : ''}>${g}</option>`).join('')}
            </select>
          </div>

          <div class="field-group"><label>Target Weight (kg)</label><input type="number" id="editTargetWeight" step="0.1" value="${client.target_weight || ''}"></div>
          <div class="field-group"><label>Goal Deadline</label><input type="date" id="editDeadline" value="${client.target_date || ''}"></div>

          <div class="field-group"><label>Program</label>
            <select id="editProgram">
              ${PROGRAM_OPTIONS.map(p => `<option value="${p}" ${p === selectedProgram ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </div>
          <div class="field-group"><label>Program Duration</label>
            <select id="editDuration">
              ${DURATION_OPTIONS.map(d => `<option value="${d}" ${d === selectedDuration ? 'selected' : ''}>${d}</option>`).join('')}
            </select>
          </div>

          <div class="btn-row">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-secondary" onclick="closePanel()">Cancel</button>
          </div>
        </form>
        <script>
          function calculateBMI() {
            const height = parseFloat(document.getElementById('editHeight').value);
            const weight = parseFloat(document.getElementById('editWeight').value);
            const bmiDisplay = document.getElementById('bmiDisplay');
            if (height > 0 && weight > 0) {
              const bmi = weight / ((height/100) ** 2);
              bmiDisplay.textContent = bmi.toFixed(1);
            } else {
              bmiDisplay.textContent = '—';
            }
          }
          window.calculateBMI = calculateBMI;
        <\/script>
      `;
    }

    // -------- EDIT FORM SUBMISSION (handled globally) --------
    document.addEventListener('submit', async function(e) {
      if (e.target && e.target.id === 'editClientForm') {
        e.preventDefault();
        const form = e.target;
        const firstName = form.querySelector('#editFirstName').value.trim();
        const lastName = form.querySelector('#editLastName').value.trim();
        const email = form.querySelector('#editEmail').value.trim();
        const phone = form.querySelector('#editPhone').value.trim();
        const gender = form.querySelector('#editGender').value;
        const dob = form.querySelector('#editDob').value;
        const height = parseFloat(form.querySelector('#editHeight').value);
        const weight = parseFloat(form.querySelector('#editWeight').value);
        const conditions = Array.from(form.querySelectorAll('input[name="conditions"]:checked')).map(cb => cb.value);
        const allergies = Array.from(form.querySelectorAll('input[name="allergies"]:checked')).map(cb => cb.value);
        const goal = form.querySelector('#editGoal').value;
        const targetWeight = parseFloat(form.querySelector('#editTargetWeight').value);
        const deadline = form.querySelector('#editDeadline').value;
        const program = form.querySelector('#editProgram').value;
        const duration = form.querySelector('#editDuration').value;

        let bmi = null;
        if (height > 0 && weight > 0) {
          bmi = weight / ((height/100) ** 2);
        }

        const payload = {
          name: firstName + ' ' + lastName,
          email: email,
          phone: phone || '',
          gender: gender || '',
          dob: dob || '',
          height_cm: height || 0,
          weight_kg: weight || 0,
          bmi: bmi ? parseFloat(bmi.toFixed(1)) : null,
          medical_conditions: conditions,
          allergies: allergies,
          goal: goal,
          target_weight: targetWeight || 0,
          target_date: deadline || '',
          program: program,
          duration: duration,
        };

        try {
          await apiRequest(`/professional/clients/${clientId}`, 'PUT', payload);
          showToast('Client updated successfully!');
          closePanel();
          loadClientData(); // refresh
        } catch (e) {
          showToast('Failed to update client: ' + e.message, 'error');
        }
      }

    function renderCharts(client) {

          },
          options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: false, min: Math.min.apply(null, weightData) - 5, max: Math.max.apply(null, weightData) + 5 } } }

      }

      const macroCtx = document.getElementById('macroChart');
      if (macroCtx) {
        new Chart(macroCtx, {
          type: 'pie',
          data: { labels: ['Protein', 'Carbohydrates', 'Fat', 'Fiber'], datasets: [{ data: [30, 40, 20, 10], backgroundColor: [colors.green, colors.gold, colors.red, colors.blue], borderWidth: 2, borderColor: '#fff' }] },
          options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { padding: 15, usePointStyle: true } } } }
        });
      }
      // Water chart
      const waterCtx = document.getElementById('waterChart');
      if (waterCtx) {
        new Chart(waterCtx, {
          type: 'line',
          data: { labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], datasets: [{ label: 'Water (L)', data: [2.5, 2.8, 2.2, 3.0, 2.9, 2.6, client.water_intake || 2.8], borderColor: colors.blue, backgroundColor: colors.blue + '30', fill: true, tension: 0.4, pointBackgroundColor: colors.blue }] },
          options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 4 } } }
        });
      }
      // Goal chart
      const goalCtx = document.getElementById('goalChart');
      if (goalCtx) {
        new Chart(goalCtx, {
          type: 'doughnut',
          data: { labels: ['Weight Loss', 'Water Intake', 'Exercise', 'Blood Sugar'], datasets: [{ data: [client.goal_completion || 73, Math.min(100, (client.water_intake || 2.5) * 30), 65, 58], backgroundColor: [colors.green, colors.gold, colors.red, colors.blue], borderWidth: 2, borderColor: '#fff' }] },
          options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { padding: 15, usePointStyle: true } } } }
        });
      }
      // Activity radar
      const activityCtx = document.getElementById('activityChart');
      if (activityCtx) {
        new Chart(activityCtx, {
          type: 'radar',
          data: { labels: ['Meals Logged', 'Exercise', 'Water Tracking', 'Appointments', 'Reports'], datasets: [{ label: 'Activity Score', data: [client.compliance || 90, 70, Math.min(100, (client.water_intake || 2.5) * 30), 100, 75], backgroundColor: colors.purple + '40', borderColor: colors.purple, pointBackgroundColor: colors.purple, pointBorderColor: '#fff', pointBorderWidth: 2 }] },
          options: { responsive: true, plugins: { legend: { display: false } }, scales: { r: { beginAtZero: true, max: 100, ticks: { stepSize: 20 } } } }
        });
      }
      // Compliance bar
      const compCtx = document.getElementById('complianceChart');
      if (compCtx) {
        new Chart(compCtx, {
          type: 'bar',
          data: { labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'], datasets: [{ label: 'Compliance %', data: [85, 88, 82, client.compliance || 90], backgroundColor: [colors.green, colors.gold, colors.blue, colors.purple], borderRadius: 8 }] },
          options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100 } } }
        });
      }
    }

    // -------- SIDEBAR TOGGLE --------
    document.addEventListener('DOMContentLoaded', function() {
      const hamburger = document.getElementById('hamburgerBtn');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.createElement('div');
      overlay.className = 'sidebar-overlay';
      overlay.id = 'sidebarOverlay';
      document.body.appendChild(overlay);

      hamburger?.addEventListener('click', function() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      });
      overlay.addEventListener('click', function() {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
      });
      document.querySelectorAll('.sidebar-nav .nav-link').forEach(link => {
        link.addEventListener('click', function() {
          sidebar.classList.remove('open');
          overlay.classList.remove('show');
        });
      });

      // Floating AI button
      document.getElementById('floatingAiBtn')?.addEventListener('click', function() {
        window.location.href = 'ai-assistant.html?client=' + encodeURIComponent(clientId);
      });

      // Load data
      loadClientData();
    });
  </script>
</body>
</html>
