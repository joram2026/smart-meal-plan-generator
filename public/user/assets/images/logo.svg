<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Primary Leaf Gradient (Sukuma Green) -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7A2A" />
      <stop offset="100%" stop-color="#2D5016" />
    </linearGradient>
    <!-- Secondary Sprout Gradient (Maize Gold) -->
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A33D" />
      <stop offset="100%" stop-color="#C97F1F" />
    </linearGradient>
    <!-- Soft Ambient Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#1A1F16" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <g filter="url(#softShadow)">
    <!-- Base organic shield shape representing natural nutrition & health -->
    <path d="M 50,10 
             C 74,10 88,28 85,55 
             C 82,80 50,90 50,90 
             C 50,90 18,80 15,55 
             C 12,28 26,10 50,10 Z" 
          fill="url(#leafGrad)" />
          
    <!-- Symmetrical inner glow accent curve -->
    <path d="M 50,20 
             C 65,20 74,32 72,51 
             C 70,68 50,79 50,79 
             C 50,79 30,68 28,51 
             C 26,32 35,20 50,20 Z" 
          fill="#FFF8EE" opacity="0.12" />

    <!-- Stylized gold seedling stem representing harvest, energy & health -->
    <path d="M 50,75 L 50,32" stroke="url(#sunGrad)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Left organic sprout representing food security -->
    <path d="M 50,62 C 43,58 35,56 33,45 C 33,36 45,38 50,49" fill="url(#sunGrad)" />
    
    <!-- Right organic sprout representing digital crop insights -->
    <path d="M 50,49 C 57,45 65,43 67,32 C 67,23 55,25 50,36" fill="url(#sunGrad)" />

    <!-- A shining core beacon representing the Smart AI/intelligence aspect -->
    <circle cx="50" cy="24" r="5" fill="#FFF8EE" />
  </g>
</svg>
