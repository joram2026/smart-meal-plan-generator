<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — Smart Lishe</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <!-- Brand -->
    <div class="auth-brand">
      <div class="brand-icon"><i class="fa-solid fa-seedling"></i></div>
      <h1 id="pageTitle">Email Sent</h1>
      <p id="pageSubtitle">Check your inbox</p>
    </div>

    <div class="auth-success">
      <div class="success-icon"><i class="fa-regular fa-envelope"></i></div>
      <h3 id="successTitle">Email Sent Successfully</h3>
      <p id="successMessage">A password reset link has been sent to your email address. Please check your inbox and follow the instructions.</p>

      <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;">
        <button class="btn btn-primary" id="continueBtn">
          <i class="fa-regular fa-arrow-right"></i> Continue
        </button>
        <button class="btn btn-secondary" id="resendBtn">
          <i class="fa-regular fa-rotate"></i> Resend Email
        </button>
      </div>
    </div>

    <div class="auth-links">
      <p><a href="login.html">Back to Login</a></p>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SMART LISHE — VERIFY EMAIL (Backend-Integrated)
   ============================================================ */

const BASE_URL = '/api';

// ---- Get query parameters ----
const urlParams = new URLSearchParams(window.location.search);
const type = urlParams.get('type') || 'reset'; // 'reset' or 'verify'
const emailFromUrl = urlParams.get('email');

// ---- Get email from localStorage (set by forgot-password page) ----
const storedEmail = localStorage.getItem('reset_email');

// ---- Determine the email to use ----
const userEmail = emailFromUrl || storedEmail || '';

// ---- Update page content based on type ----
function updatePageContent() {
  const title = document.getElementById('pageTitle');
  const subtitle = document.getElementById('pageSubtitle');
  const successTitle = document.getElementById('successTitle');
  const successMessage = document.getElementById('successMessage');

  if (type === 'verify') {
    title.textContent = 'Verify Your Email';
    subtitle.textContent = 'Almost there!';
    successTitle.textContent = 'Verification Email Sent';
    successMessage.textContent = `A verification link has been sent to ${userEmail || 'your email'}. Please check your inbox and click the link to activate your account.`;
  } else {
    // default: password reset
    title.textContent = 'Email Sent';
    subtitle.textContent = 'Check your inbox';
    successTitle.textContent = 'Password Reset Link Sent';
    successMessage.textContent = `A password reset link has been sent to ${userEmail || 'your email'}. Please check your inbox and follow the instructions.`;
  }
}

// ---- If no email, show a warning ----
if (!userEmail) {
  document.addEventListener('DOMContentLoaded', function() {
    showToast('No email address provided.', 'error');
  });
}

// ---- Toast helper ----
function showToast(msg, type = 'success') {
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
  t.innerHTML = `<i class="fa-solid ${icon}"></i><span>${msg}</span>`;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(40px)'; setTimeout(() => t.remove(), 350); }, 3500);
}

// ---- Continue button ----
document.getElementById('continueBtn').addEventListener('click', function() {
  // If it's a verification flow, go to login; for reset, go to login as well
  // (the reset link with token is sent via email, not here)
  window.location.href = 'login.html';
});

// ---- Resend email ----
document.getElementById('resendBtn').addEventListener('click', async function() {
  if (!userEmail) {
    showToast('No email address to resend to.', 'error');
    return;
  }

  const btn = this;
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

  // Determine which endpoint to call
  let endpoint = '/auth/request-reset';
  if (type === 'verify') {
    endpoint = '/auth/resend-verification';  // We'll implement this later if needed
    // For now, we'll treat it as reset to avoid 404.
    // If you have email verification, implement that endpoint.
    showToast('Verification resend not implemented yet. Using password reset.', 'error');
  }

  try {
    const response = await fetch(`${BASE_URL}${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: userEmail })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || data.message || 'Request failed');
    }

    showToast(type === 'verify' ? 'Verification email resent.' : 'Reset link resent.');
  } catch (err) {
    showToast(err.message || 'An error occurred. Please try again.', 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
});

// ---- Initialise ----
document.addEventListener('DOMContentLoaded', function() {
  updatePageContent();

  // If we have an email, show it in the message
  const emailDisplay = document.querySelector('.auth-success p');
  if (emailDisplay && userEmail) {
    emailDisplay.textContent = emailDisplay.textContent.replace('your email', userEmail);
  }
});
</script>
</body>
</html>
