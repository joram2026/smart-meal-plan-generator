
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Smart Lishe</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <!-- Brand -->
    <div class="auth-brand">
      <div class="brand-icon"><i class="fa-solid fa-seedling"></i></div>
      <h1>Forgot Password</h1>
      <p>Enter your email and we'll send you a reset link.</p>
    </div>

    <!-- Back to Login -->
    <a href="login.html" class="back-home" style="display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;text-decoration:none;color:var(--text-secondary);font-weight:600;font-size:0.9rem;">
      <i class="fa-solid fa-arrow-left"></i> Back To Login
    </a>

    <!-- Form (visible initially) -->
    <form id="forgotForm" class="auth-form" novalidate>
      <div class="field-group">
        <label for="forgotEmail">Email Address</label>
        <input type="email" id="forgotEmail" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <button type="submit" class="btn btn-primary" id="forgotBtn">
        <i class="fa-regular fa-paper-plane"></i> Send Reset Link
      </button>
    </form>

    <!-- Success Message (hidden initially) -->
    <div class="auth-success" id="forgotSuccess" style="display:none;">
      <div class="success-icon"><i class="fa-regular fa-circle-check"></i></div>
      <h3>Check Your Email</h3>
      <p>If an account exists for that email, we've sent password reset instructions.</p>
      <p style="font-size:0.85rem;color:var(--text-muted);margin-top:8px;">
        Didn't receive anything? <a href="#" id="resendLink" style="color:var(--sukuma);">Try again</a>
      </p>
      <button class="btn btn-primary" id="goToLoginFromForgot" style="margin-top:12px;">
        <i class="fa-regular fa-right-to-bracket"></i> Back to Login
      </button>
    </div>

    <div class="auth-links" id="forgotLinks">
      <p>Remember your password? <a href="login.html">Login</a></p>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SMART LISHE — FORGOT PASSWORD (Backend-Integrated)
   ============================================================ */

const BASE_URL = '/api';

// ---- Toast ----
function showToast(msg, type = 'success') {
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' error' : '');
  const icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
  t.innerHTML = `<i class="fa-solid ${icon}"></i><span>${msg}</span>`;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(40px)'; setTimeout(() => t.remove(), 350); }, 3500);
}

// ---- Form Submit ----
document.getElementById('forgotForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const email = document.getElementById('forgotEmail').value.trim();

  if (!email || !email.includes('@')) {
    showToast('Please enter a valid email address.', 'error');
    return;
  }

  const btn = document.getElementById('forgotBtn');
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

  try {
    const response = await fetch(`${BASE_URL}/auth/request-reset`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || data.message || 'Request failed');
    }

    // Success – hide form, show success message
    document.getElementById('forgotForm').style.display = 'none';
    document.getElementById('forgotLinks').style.display = 'none';
    document.getElementById('forgotSuccess').style.display = 'block';
    
    const successMsg = data.message || `Password reset link sent to ${email}.`;
    const subDesc = document.querySelector('#forgotSuccess p');
    if (subDesc) {
      subDesc.innerHTML = `We have sent a secure password reset link to <strong>${email}</strong>. Please check your inbox or spam folder.`;
    }
    showToast(successMsg);

  } catch (err) {
    showToast(err.message || 'An error occurred. Please try again.', 'error');
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
});

// ---- Resend (reset the form) ----
document.getElementById('resendLink').addEventListener('click', function(e) {
  e.preventDefault();
  document.getElementById('forgotSuccess').style.display = 'none';
  document.getElementById('forgotForm').style.display = 'block';
  document.getElementById('forgotLinks').style.display = 'block';
  document.getElementById('forgotEmail').value = '';
  document.getElementById('forgotEmail').focus();
  document.getElementById('forgotBtn').disabled = false;
  document.getElementById('forgotBtn').innerHTML = '<i class="fa-regular fa-paper-plane"></i> Send Reset Link';
});

// ---- Go to Login ----
document.getElementById('goToLoginFromForgot').addEventListener('click', function() {
  window.location.href = 'login.html';
});

// ---- Auto-focus email field ----
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('forgotEmail').focus();
});
</script>
</body>
</html>
